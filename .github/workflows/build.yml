name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      # Build ONEDIR (pasta), definido pelo "Tibia 2.spec" (exclude_binaries + COLLECT).
      #
      # Onedir e nao onefile: o bootloader onefile do PyInstaller 6 extrai tudo para
      # %TEMP%, relanca uma copia de si mesmo e o filho faz uma "security validation"
      # que abre o processo-PAI (QueryFullProcessImageNameW). Quando AV/EDR intercepta,
      # aborta com "Security validation failure: failed to obtain executable path for
      # parent process" - era o erro intermitente ao abrir o launcher. Onedir nao
      # relanca processo-filho, entao essa rotina nunca roda. Ver Tibia 2.spec.
      #
      # Saida: dist-noupx\Tibia 2\Tibia 2.exe + dist-noupx\Tibia 2\_internal\.
      - name: Build (onedir)
        run: python -m PyInstaller --noconfirm --distpath dist-noupx --workpath build-noupx "Tibia 2.spec"

      # --- Assinatura de codigo (SignPath) -------------------------------------
      # Quando ligar: assine dist-noupx\Tibia 2\Tibia 2.exe ANTES do passo do
      # instalador (para a pasta instalada ficar assinada) e assine tambem o
      # dist\Tibia 2 Setup.exe. Descomente apos aprovacao no SignPath Foundation
      # (https://about.signpath.io/product/open-source) e configure os secrets
      # SIGNPATH_* / SIGNPATH_API_TOKEN no repo.
      #
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: tibia2-launcher
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: exe
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist-noupx/Tibia 2

      # Instalador Inno: empacota a pasta onedir (dist-noupx\Tibia 2\*) e escreve
      # dist\Tibia 2 Setup.exe. Ver installer.iss.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # launcher.json (auto-update) NAO e gerado aqui de proposito. A distribuicao e
      # feita pelo deploy do monorepo (scripts/deploy/deploy-cliente.ps1), que le a
      # LAUNCHER_VERSION do launcher.py, zipa a pasta onedir, calcula o zip_crc do
      # zip REALMENTE publicado e escreve {version, zip_crc, url}. Um launcher.json
      # gerado aqui (crc de OUTRO zip) nao casaria com o que o servidor serve e
      # jogaria todo mundo num laco de auto-update. Ver deploy-online.md no monorepo.

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Tibia2-launcher
          path: |
            dist-noupx/Tibia 2
            dist/Tibia 2 Setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tibia 2 Setup.exe
